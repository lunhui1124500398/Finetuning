[project]
name = "finetuning-tool"
version = "9.6.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "pandas>=2.1,<3",
    "pillow>=10,<13",
    "pyqt6>=6.6,<7",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6,<7", "pytest>=8,<9"]

[tool.uv]
package = false
