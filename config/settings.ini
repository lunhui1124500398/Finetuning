[Paths]
original_path = D:/pythonProject/Finetuning/test_data/at-NP1-origin
denoised_path = D:/pythonProject/Finetuning/test_data/at-NP1-origin_denoised
mask_path = D:/pythonProject/Finetuning/test_data/binary
save_path = D:/pythonProject/Finetuning/test_data/test_save

[Preview]
rows = 3
columns = 3
image_size = 180
overlay_style = area

[Colors]
mask_overlay_color = 255,255,17,90
contour_line_color = 0, 255, 0, 100
inner_contour_color = 0, 255, 0, 100
contour_thickness = 1

[Drawing]
brush_size = 1
eraser_size = 10
default_zoom = 1.0

[Keybindings]
next_image = D; Right
prev_image = A; Left
save = Ctrl+S
save_and_next = S
draw_mode = Q
polygon_mode = P
erase_mode = E
clear_mask = W
toggle_mask = Z
auto_save = X
high_contrast = C
import_files = I
toggle_image_source = Space

[Debug]
enabled = false
save_path = ./debug_images

[QSS_Colors]
background-color-darkest = #252627
background-color-dark = #2e2f30
background-color-light = #3a3b3c
